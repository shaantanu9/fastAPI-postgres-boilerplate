[program:fastapi]
# Command to run the FastAPI application
command=/var/www/fastapi/.venv/bin/gunicorn
    --config /var/www/fastapi/production_configs/gunicorn.conf.py
    --bind unix:/run/fastapi/gunicorn.sock
    --pid /run/fastapi/gunicorn.pid
    app.main:app

# Directory to run the command from
directory=/var/www/fastapi

# User and group to run the process as
user=www-data
group=www-data

# Environment variables
environment=
    PATH="/var/www/fastapi/.venv/bin",
    PYTHONPATH="/var/www/fastapi",
    PYTHONUNBUFFERED="1",
    PYTHONDONTWRITEBYTECODE="1"

# Process management
numprocs=1
numprocs_start=0
process_name=%(program_name)s_%(process_num)02d

# Auto-start and restart settings
autostart=true
autorestart=true
startretries=3
startsecs=10
exitcodes=0

# Signal handling for graceful shutdown
stopsignal=TERM
stopwaitsecs=30
stopasgroup=true
killasgroup=true

# Logging configuration
stdout_logfile=/var/log/supervisor/fastapi_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
stdout_capture_maxbytes=1MB
stdout_events_enabled=false

stderr_logfile=/var/log/supervisor/fastapi_stderr.log
stderr_logfile_maxbytes=50MB
stderr_logfile_backups=10
stderr_capture_maxbytes=1MB
stderr_events_enabled=false

# Additional supervisor settings
redirect_stderr=false
priority=900
serverurl=AUTO

# Resource limits (optional)
# Set memory limit (in MB) - uncomment if needed
# memlimit_mb=2048

[group:fastapi-workers]
programs=fastapi
priority=900 