input {
  # TCP input for direct log shipping from FastAPI
  tcp {
    port => 5000
    codec => json_lines
    type => "fastapi-direct"
  }
  
  # Beats input for Filebeat
  beats {
    port => 5044
    type => "fastapi-beats"
  }
  
  # File input for local log files
  file {
    path => "/app/logs/*.log"
    start_position => "beginning"
    codec => json
    type => "fastapi-file"
  }
}

filter {
  # Parse timestamp
  if [@timestamp] {
    date {
      match => [ "@timestamp", "ISO8601" ]
    }
  }
  
  # Add common fields
  mutate {
    add_field => { "[@metadata][index_prefix]" => "fastapi-logs" }
  }
  
  # Parse log level
  if [level] {
    mutate {
      uppercase => [ "level" ]
    }
  }
  
  # Parse correlation ID
  if [correlation_id] {
    mutate {
      add_field => { "trace_id" => "%{correlation_id}" }
    }
  }
  
  # Parse user ID
  if [user_id] {
    mutate {
      add_field => { "user" => "%{user_id}" }
    }
  }
  
  # Parse HTTP request fields
  if [http_method] and [http_path] {
    mutate {
      add_field => { "request" => "%{http_method} %{http_path}" }
    }
  }
  
  # Parse database operation fields
  if [db_operation] and [db_table] {
    mutate {
      add_field => { "database_query" => "%{db_operation} on %{db_table}" }
    }
  }
  
  # Parse security events
  if [security_event_type] {
    mutate {
      add_tag => [ "security" ]
      add_field => { "alert_level" => "medium" }
    }
    
    # High priority security events
    if [security_event_type] in ["failed_login", "unauthorized_access", "suspicious_activity"] {
      mutate {
        replace => { "alert_level" => "high" }
      }
    }
  }
  
  # Parse business events
  if [business_event_name] {
    mutate {
      add_tag => [ "business" ]
    }
  }
  
  # Parse error events
  if [level] == "ERROR" {
    mutate {
      add_tag => [ "error" ]
    }
  }
  
  # Parse performance metrics
  if [duration_ms] {
    mutate {
      convert => { "duration_ms" => "float" }
    }
    
    # Tag slow requests
    if [duration_ms] > 1000 {
      mutate {
        add_tag => [ "slow_request" ]
      }
    }
  }
  
  # Geoip for IP addresses
  if [ip_address] {
    geoip {
      source => "ip_address"
      target => "geoip"
    }
  }
  
  # Remove sensitive fields
  mutate {
    remove_field => [ "password", "token", "secret", "key", "authorization" ]
  }
}

output {
  # Output to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "%{[@metadata][index_prefix]}-%{+YYYY.MM.dd}"
    template_name => "fastapi-logs"
    template_pattern => "fastapi-logs-*"
    template => {
      "index_patterns" => ["fastapi-logs-*"]
      "settings" => {
        "number_of_shards" => 1
        "number_of_replicas" => 0
        "index.refresh_interval" => "5s"
      }
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "level" => { "type" => "keyword" }
          "message" => { "type" => "text", "analyzer" => "standard" }
          "service" => { "type" => "keyword" }
          "environment" => { "type" => "keyword" }
          "correlation_id" => { "type" => "keyword" }
          "user_id" => { "type" => "keyword" }
          "http_method" => { "type" => "keyword" }
          "http_path" => { "type" => "keyword" }
          "http_status_code" => { "type" => "integer" }
          "duration_ms" => { "type" => "float" }
          "db_operation" => { "type" => "keyword" }
          "db_table" => { "type" => "keyword" }
          "security_event_type" => { "type" => "keyword" }
          "business_event_name" => { "type" => "keyword" }
          "ip_address" => { "type" => "ip" }
          "geoip" => {
            "properties" => {
              "location" => { "type" => "geo_point" }
              "country_name" => { "type" => "keyword" }
              "city_name" => { "type" => "keyword" }
            }
          }
        }
      }
    }
  }
  
  # Debug output (optional)
  # stdout { codec => rubydebug }
} 