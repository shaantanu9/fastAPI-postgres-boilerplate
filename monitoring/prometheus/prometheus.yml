global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  # - "first_rules.yml"
  # - "second_rules.yml"

scrape_configs:
  # Prometheus itself
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  # FastAPI Application
  - job_name: "fastapi-app"
    static_configs:
      - targets: ["host.docker.internal:8000"] # For Docker Desktop
        # - targets: ['172.17.0.1:8000']        # For Linux Docker
    metrics_path: "/metrics"
    scrape_interval: 30s
    scrape_timeout: 10s

  # System metrics (if node_exporter is installed)
  # - job_name: 'node_exporter'
  #   static_configs:
  #     - targets: ['host.docker.internal:9100']

  # Redis metrics (if redis_exporter is installed)
  # - job_name: 'redis_exporter'
  #   static_configs:
  #     - targets: ['host.docker.internal:9121']

  # PostgreSQL metrics (if postgres_exporter is installed)
  # - job_name: 'postgres_exporter'
  #   static_configs:
  #     - targets: ['host.docker.internal:9187']
