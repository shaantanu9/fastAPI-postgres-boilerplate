    "qrcode>=8.2",
    "python-jose>=3.5.0",
    "bcrypt>=4.3.0",
    # Enterprise features dependencies
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    "aiosmtplib==3.0.1",
